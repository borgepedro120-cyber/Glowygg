<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Glowy</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --azul: #17c3e6;
    --roxo-rosa: #b8298f;
    --rosa: #ff2d87;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    background: #f6f1e7;
    color: #3a352c;
    padding: 28px 20px 80px;
  }
  .topo {
    max-width: 560px;
    margin: 0 auto 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .topo h1 {
    font-family: 'Fraunces', serif;
    font-size: 1.6rem;
    color: var(--roxo-rosa);
    margin: 0;
  }
  .btn-voltar {
    background: none;
    border: 1.5px solid #d8d0c0;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.82rem;
    color: #8a8478;
    cursor: pointer;
  }
  .item {
    max-width: 560px;
    margin: 0 auto 12px;
    background: #fff;
    border-radius: 16px;
    padding: 16px 18px;
    border: 1px solid #ece5d5;
  }
  .item .chave {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--rosa);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .item input, .item textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #e5ddc9;
    border-radius: 8px;
    font-size: 0.92rem;
    font-family: inherit;
    margin-bottom: 8px;
    background: #fdfaf4;
  }
  .item textarea { resize: vertical; min-height: 44px; }
  .item .acoes {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    align-items: center;
  }
  .btn-salvar {
    background: var(--roxo-rosa);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 18px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .status {
    font-size: 0.78rem;
    color: #1e824c;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .status.mostrar { opacity: 1; }
  .carregando, .bloqueado {
    max-width: 480px;
    margin: 80px auto;
    text-align: center;
    color: #8a8478;
  }
</style>
</head>
<body>
  <div id="carregando" class="carregando">Verificando acesso...</div>
  <div id="bloqueado" class="bloqueado" style="display:none;">Acesso restrito.</div>

  <div id="conteudo" style="display:none;">
    <div class="topo">
      <h1>Admin — Rotina</h1>
      <button class="btn-voltar" onclick="window.location.href='dashboard.html'">Voltar</button>
    </div>
    <div id="lista-itens"></div>
  </div>

<script>
  const SUPABASE_URL = 'https://uupqiqxsnwwzspqhyalq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1cHFpcXhzbnd3enNwcWh5YWxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MTg5MzcsImV4cCI6MjEwMzE5NDkzN30.RZX7e6QaR9lCEwaxWXJZzxJyUkbjC6rPubpQyI7ln5o';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const EMAIL_ADMIN = 'borgepedro120@gmail.com';

  async function iniciar() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user || user.email !== EMAIL_ADMIN) {
      document.getElementById('carregando').style.display = 'none';
      document.getElementById('bloqueado').style.display = 'block';
      return;
    }

    const { data, error } = await supabaseClient
      .from('conteudo_rotina')
      .select('id, chave, nome, descricao')
      .order('chave');

    if (error || !data) {
      document.getElementById('carregando').textContent = 'Erro ao carregar dados.';
      return;
    }

    const lista = document.getElementById('lista-itens');
    lista.innerHTML = data.map(item => `
      <div class="item" data-id="${item.id}">
        <div class="chave">${item.chave}</div>
        <input type="text" class="input-nome" value="${(item.nome || '').replace(/"/g, '&quot;')}" placeholder="Nome do produto">
        <textarea class="input-desc" placeholder="Descrição">${item.descricao || ''}</textarea>
        <div class="acoes">
          <span class="status">Salvo!</span>
          <button class="btn-salvar">Salvar</button>
        </div>
      </div>
    `).join('');

    lista.querySelectorAll('.item').forEach(itemEl => {
      const id = itemEl.dataset.id;
      const btn = itemEl.querySelector('.btn-salvar');
      const status = itemEl.querySelector('.status');
      btn.addEventListener('click', async () => {
        const nome = itemEl.querySelector('.input-nome').value.trim();
        const descricao = itemEl.querySelector('.input-desc').value.trim();
        btn.disabled = true;
        btn.textContent = 'Salvando...';
        const { error } = await supabaseClient
          .from('conteudo_rotina')
          .update({ nome, descricao })
          .eq('id', id);
        btn.disabled = false;
        btn.textContent = 'Salvar';
        if (!error) {
          status.classList.add('mostrar');
          setTimeout(() => status.classList.remove('mostrar'), 1500);
        } else {
          alert('Erro ao salvar: ' + error.message);
        }
      });
    });

    document.getElementById('carregando').style.display = 'none';
    document.getElementById('conteudo').style.display = 'block';
  }

  iniciar();
</script>
</body>
</html>
