<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sua rotina — Glowy</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --teal-deep: #0e4f57;
    --teal-mid: #17828d;
    --cream: #fdfaf4;
    --gold: #d4a24c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    background: #f6f1e7;
    color: #3a352c;
    padding: 28px 20px 60px;
  }
  .topo {
    max-width: 480px;
    margin: 0 auto 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .topo h1 {
    font-family: 'Fraunces', serif;
    font-size: 1.6rem;
    color: var(--teal-deep);
    margin: 0;
  }
  .btn-sair {
    background: none;
    border: 1.5px solid #d8d0c0;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.82rem;
    color: #8a8478;
    cursor: pointer;
  }
  .resumo {
    max-width: 480px;
    margin: 0 auto 28px;
    background: var(--teal-deep);
    color: #fff;
    border-radius: 18px;
    padding: 20px 22px;
    opacity: 0;
    transform: scale(0.94);
    animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes pop {
    to { opacity: 1; transform: scale(1); }
  }
  .resumo p {
    margin: 0;
    font-size: 0.88rem;
    opacity: 0.85;
  }
  .resumo strong {
    font-family: 'Fraunces', serif;
    font-size: 1.2rem;
    display: block;
    margin-bottom: 4px;
  }
  .secao {
    max-width: 480px;
    margin: 0 auto 24px;
  }
  .secao-titulo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--teal-mid);
    margin-bottom: 12px;
  }
  .passo {
    display: flex;
    gap: 14px;
    background: #fff;
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 10px;
    border: 1px solid #ece5d5;
    opacity: 0;
    transform: translateX(-12px);
    animation: entrarPasso 0.5s ease forwards;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .passo:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  }
  @keyframes entrarPasso {
    to { opacity: 1; transform: translateX(0); }
  }
  .passo .num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--gold);
    color: #fff;
    font-size: 0.85rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.3s;
  }
  .passo:hover .num {
    transform: rotate(360deg);
  }
  .passo .conteudo strong {
    display: block;
    font-size: 0.95rem;
    margin-bottom: 2px;
  }
  .passo .conteudo span {
    font-size: 0.85rem;
    color: #8a8478;
  }
  .carregando {
    max-width: 480px;
    margin: 60px auto;
    text-align: center;
    color: #8a8478;
  }
  .btn-admin-flutuante {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--teal-deep);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 14px 22px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    display: none;
    align-items: center;
    gap: 8px;
    z-index: 10;
  }
</style>
</head>
<body>
  <div id="carregando" class="carregando">Montando sua rotina...</div>

  <div id="conteudo" style="display:none;">
    <div class="topo">
      <h1>Sua rotina</h1>
      <div style="display:flex; gap:8px;">
        <button class="btn-sair" id="btn-refazer">Refazer quiz</button>
        <button class="btn-sair" id="btn-sair">Sair</button>
      </div>
    </div>

    <div class="resumo">
      <strong id="resumo-tipo"></strong>
      <p id="resumo-foco"></p>
    </div>

    <div class="secao">
      <div class="secao-titulo">☀️ Manhã</div>
      <div id="lista-manha"></div>
    </div>

    <div class="secao">
      <div class="secao-titulo">🌙 Noite</div>
      <div id="lista-noite"></div>
    </div>
  </div>

  <button class="btn-admin-flutuante" id="btn-admin">⚙️ Admin</button>
