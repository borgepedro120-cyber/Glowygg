<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar na Glowygg — sua rotina de pele</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Pacifico&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --azul: #17c3e6;
    --azul-escuro: #0e8fae;
    --rosa: #ff2d87;
    --roxo-rosa: #b8298f;
    --cream: #fdfaf4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(150deg, var(--azul) 0%, var(--roxo-rosa) 100%);
    background-size: 200% 200%;
    animation: breathe 8s ease-in-out infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
  }
  @keyframes breathe {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  #fundo-particulas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  .logo-marca {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: flex-end;
    gap: 4px;
    margin-bottom: 22px;
    opacity: 0;
    transform: translateY(-10px);
    animation: aparecerLogo 0.7s ease forwards;
  }
  .logo-marca .estrela {
    position: absolute;
    color: var(--rosa);
    filter: drop-shadow(0 0 6px rgba(255,45,135,0.6));
    animation: brilharEstrela 2.4s ease-in-out infinite;
  }
  .logo-marca .e1 { top: -18px; left: -14px; font-size: 1.1rem; animation-delay: 0s; }
  .logo-marca .e2 { top: -22px; right: -18px; font-size: 1.6rem; animation-delay: 0.6s; }
  .logo-marca .e3 { bottom: -6px; left: -24px; font-size: 0.9rem; animation-delay: 1.2s; }
  @keyframes brilharEstrela {
    0%, 100% { opacity: 0.5; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.1); }
  }
  .logo-marca .txt-glowy {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 2.4rem;
    color: var(--rosa);
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    letter-spacing: -1px;
  }
  .logo-marca .txt-gg {
    font-family: 'Pacifico', cursive;
    font-size: 2rem;
    color: #ffb3d9;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    margin-bottom: 2px;
  }
  @keyframes aparecerLogo {
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    position: relative;
    background: rgba(253, 250, 244, 0.95);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 44px 34px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.3);
    opacity: 0;
    transform: translateY(24px);
    animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    z-index: 1;
  }
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  .mascote {
    display: flex;
    justify-content: center;
    margin-bottom: 4px;
  }
  .logo {
    text-align: center;
    margin-bottom: 4px;
  }
  .logo span {
    font-family: 'Fraunces', serif;
    font-size: 2.1rem;
    font-weight: 600;
    color: var(--roxo-rosa);
    letter-spacing: -0.5px;
  }
  .subtitle {
    text-align: center;
    color: #8a8478;
    font-size: 0.92rem;
    margin-bottom: 30px;
    font-style: italic;
  }
  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--roxo-rosa);
    margin-bottom: 6px;
    margin-top: 18px;
  }
  input {
    width: 100%;
    padding: 13px 14px;
    border: none;
    border-bottom: 2px solid #e5ddc9;
    border-radius: 4px 4px 0 0;
    font-size: 0.95rem;
    background: rgba(255,255,255,0.6);
    outline: none;
    transition: border-color 0.25s, background 0.25s;
  }
  input:focus {
    border-color: var(--rosa);
    background: rgba(255,255,255,0.9);
  }
  .btn-primary {
    width: 100%;
    padding: 14px;
    margin-top: 28px;
    background: linear-gradient(135deg, var(--azul), var(--rosa));
    color: #fff;
    border: none;
    border-radius: 30px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 20px rgba(184,41,143,0.35);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(184,41,143,0.45);
  }
  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .divider {
    display: flex;
    align-items: center;
    margin: 24px 0;
    color: #b3ab9a;
    font-size: 0.78rem;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #e5ddc9;
  }
  .divider span { padding: 0 12px; }
  .btn-google {
    width: 100%;
    padding: 12px;
    background: #fff;
    border: 1.5px solid #e5ddc9;
    border-radius: 30px;
    font-size: 0.92rem;
    font-weight: 500;
    color: #4a453c;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .btn-google:hover { border-color: var(--rosa); }
  .footer-text {
    text-align: center;
    margin-top: 26px;
    font-size: 0.86rem;
    color: #8a8478;
  }
  .footer-text a {
    color: var(--rosa);
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .msg {
    text-align: center;
    font-size: 0.85rem;
    margin-top: 14px;
    min-height: 18px;
  }
  .msg.error { color: #c0392b; }
  .msg.success { color: #1e824c; }
</style>
</head>
<body>
  <canvas id="fundo-particulas"></canvas>

  <div class="logo-marca">
    <span class="estrela e1">✦</span>
    <span class="estrela e2">✦</span>
    <span class="estrela e3">✦</span>
    <span class="txt-glowy">Glowy</span>
    <span class="txt-gg">gg</span>
  </div>

  <div class="card">
    <div class="mascote">
      <svg id="mascote-svg" viewBox="0 0 120 120" width="88" height="88">
        <circle cx="60" cy="60" r="50" fill="#ff2d87"/>
        <circle id="olho-esq" cx="42" cy="55" r="9" fill="#fff"/>
        <circle id="pupila-esq" cx="42" cy="55" r="4" fill="#0e8fae"/>
        <circle id="olho-dir" cx="78" cy="55" r="9" fill="#fff"/>
        <circle id="pupila-dir" cx="78" cy="55" r="4" fill="#0e8fae"/>
        <path d="M45 80 Q60 90 75 80" stroke="#0e8fae" stroke-width="3" fill="none" stroke-linecap="round"/>
        <g id="mao-esq" style="opacity:0; transition: opacity 0.25s;">
          <ellipse cx="42" cy="55" rx="13" ry="13" fill="#ff2d87" stroke="#b8298f" stroke-width="2"/>
        </g>
        <g id="mao-dir" style="opacity:0; transition: opacity 0.25s;">
          <ellipse cx="78" cy="55" rx="13" ry="13" fill="#ff2d87" stroke="#b8298f" stroke-width="2"/>
        </g>
      </svg>
    </div>
    <div class="logo"><span>Glowy</span></div>
    <p class="subtitle" id="subtitle">Bem-vindo à sua melhor pele</p>

    <form id="auth-form">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="voce@email.com" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="••••••••" required minlength="6">

      <button type="submit" class="btn-primary" id="btn-submit">Entrar na Glowy</button>
    </form>

    <p class="msg" id="msg"></p>

    <div class="divider"><span>ou</span></div>
    <button class="btn-google" id="btn-google">Continuar com Google</button>

    <p class="footer-text" id="footer-text">Não tem conta? <a id="toggle-mode">Criar conta</a></p>
  </div>

<script>
  // Fundo de partículas
  const canvasFundo = document.getElementById('fundo-particulas');
  const ctxFundo = canvasFundo.getContext('2d');
  let particulas = [];

  function redimensionar() {
    canvasFundo.width = window.innerWidth;
    canvasFundo.height = window.innerHeight;
  }
  window.addEventListener('resize', redimensionar);
  redimensionar();

  const CORES = ['#ff2d87', '#ffffff', '#17c3e6'];
  for (let i = 0; i < 60; i++) {
    particulas.push({
      x: Math.random() * canvasFundo.width,
      y: Math.random() * canvasFundo.height,
      r: Math.random() * 1.8 + 0.6,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      cor: CORES[Math.floor(Math.random() * CORES.length)],
      alpha: Math.random() * 0.5 + 0.25
    });
  }

  function desenharFundo() {
    ctxFundo.clearRect(0, 0, canvasFundo.width, canvasFundo.height);
    particulas.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) p.x = canvasFundo.width;
      if (p.x > canvasFundo.width) p.x = 0;
      if (p.y < 0) p.y = canvasFundo.height;
      if (p.y > canvasFundo.height) p.y = 0;

      ctxFundo.beginPath();
      ctxFundo.arc(p.x, p.y, p.r * 2.5, 0, Math.PI * 2);
      ctxFundo.fillStyle = p.cor + '22';
      ctxFundo.fill();

      ctxFundo.beginPath();
      ctxFundo.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctxFundo.globalAlpha = p.alpha;
      ctxFundo.fillStyle = p.cor;
      ctxFundo.fill();
      ctxFundo.globalAlpha = 1;
    });
    requestAnimationFrame(desenharFundo);
  }
  desenharFundo();
</script>

<script>
  const SUPABASE_URL = 'https://uupqiqxsnwwzspqhyalq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1cHFpcXhzbnd3enNwcWh5YWxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MTg5MzcsImV4cCI6MjEwMzE5NDkzN30.RZX7e6QaR9lCEwaxWXJZzxJyUkbjC6rPubpQyI7ln5o';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let modoCadastro = false;

  const form = document.getElementById('auth-form');
  const emailInput = document.getElementById('email');
  const senhaInput = document.getElementById('senha');
  const btnSubmit = document.getElementById('btn-submit');
  const msg = document.getElementById('msg');
  const footerText = document.getElementById('footer-text');
  const subtitle = document.getElementById('subtitle');

  function mostrarMensagem(texto, tipo) {
    msg.textContent = texto;
    msg.className = 'msg ' + tipo;
  }

  footerText.addEventListener('click', (e) => {
    if (e.target.tagName !== 'A') return;
    e.preventDefault();
    modoCadastro = !modoCadastro;
    msg.textContent = '';
    if (modoCadastro) {
      btnSubmit.textContent = 'Criar minha conta';
      subtitle.textContent = 'Vamos começar sua rotina';
      footerText.innerHTML = 'Já tem conta? <a id="toggle-mode">Entrar</a>';
    } else {
      btnSubmit.textContent = 'Entrar na Glowy';
      subtitle.textContent = 'Bem-vindo à sua melhor pele';
      footerText.innerHTML = 'Não tem conta? <a id="toggle-mode">Criar conta</a>';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();
    const senha = senhaInput.value;

    if (!email || !senha) {
      mostrarMensagem('Preencha e-mail e senha.', 'error');
      return;
    }
    if (senha.length < 6) {
      mostrarMensagem('A senha precisa ter pelo menos 6 caracteres.', 'error');
      return;
    }

    btnSubmit.disabled = true;
    btnSubmit.textContent = modoCadastro ? 'Criando conta...' : 'Entrando...';
    msg.textContent = '';

    try {
      if (modoCadastro) {
        const { data, error } = await supabaseClient.auth.signUp({ email, password: senha });
        if (error) throw error;
        mostrarMensagem('Conta criada! Redirecionando...', 'Parabens');
        setTimeout(() => { window.location.href = 'onboarding.html'; }, 1000);
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
        if (error) throw error;
        mostrarMensagem('Login feito com sucesso!', 'success');
        const concluiu = data.user?.user_metadata?.onboarding_concluido;
        setTimeout(() => {
          window.location.href = concluiu ? 'dashboard.html' : 'onboarding.html';
        }, 800);
      }
    } catch (err) {
      mostrarMensagem(err.message || 'Algo deu errado. Tente de novo.', 'error');
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.textContent = modoCadastro ? 'Criar minha conta' : 'Entrar na Glowygg';
    }
  });

  const btnGoogle = document.getElementById('btn-google');
  btnGoogle.addEventListener('click', async () => {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/onboarding.html' }
    });
    if (error) mostrarMensagem(error.message, 'error');
  });

  const pupilaEsq = document.getElementById('pupila-esq');
  const pupilaDir = document.getElementById('pupila-dir');
  const maoEsq = document.getElementById('mao-esq');
  const maoDir = document.getElementById('mao-dir');
  const svg = document.getElementById('mascote-svg');

  document.addEventListener('mousemove', (e) => {
    const rect = svg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
    const dist = 3;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    pupilaEsq.setAttribute('cx', 42 + dx);
    pupilaEsq.setAttribute('cy', 55 + dy);
    pupilaDir.setAttribute('cx', 78 + dx);
    pupilaDir.setAttribute('cy', 55 + dy);
  });

  senhaInput.addEventListener('focus', () => {
    maoEsq.style.opacity = '1';
    maoDir.style.opacity = '1';
  });
  senhaInput.addEventListener('blur', () => {
    maoEsq.style.opacity = '0';
    maoDir.style.opacity = '0';
  });
</script>
</body>
</html>
