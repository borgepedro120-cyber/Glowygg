<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar na Glowy — sua rotina de pele</title>
<style>
  :root {
    --teal-deep: #0e4f57;
    --teal-mid: #14707a;
    --cream: #fbf7f0;
    --gold: #d4a24c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, var(--teal-deep) 0%, var(--teal-mid) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--cream);
    border-radius: 20px;
    padding: 40px 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .logo {
    text-align: center;
    margin-bottom: 8px;
  }
  .logo span {
    font-size: 1.9rem;
    font-weight: 700;
    color: var(--teal-deep);
    letter-spacing: -0.5px;
  }
  .subtitle {
    text-align: center;
    color: #6b6b6b;
    font-size: 0.95rem;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--teal-deep);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e0dcd3;
    border-radius: 10px;
    font-size: 0.95rem;
    background: #fff;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus {
    border-color: var(--teal-mid);
  }
  .btn-primary {
    width: 100%;
    padding: 13px;
    margin-top: 24px;
    background: var(--teal-deep);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--teal-mid); }
  .divider {
    display: flex;
    align-items: center;
    margin: 20px 0;
    color: #a8a29a;
    font-size: 0.8rem;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #e0dcd3;
  }
  .divider span { padding: 0 12px; }
  .btn-google {
    width: 100%;
    padding: 12px;
    background: #fff;
    border: 1.5px solid #e0dcd3;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 500;
    color: #333;
    cursor: pointer;
  }
  .footer-text {
    text-align: center;
    margin-top: 24px;
    font-size: 0.88rem;
    color: #6b6b6b;
  }
  .footer-text a {
    color: var(--gold);
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span>Glowy</span></div>
    <p class="subtitle">Bem-vindo à sua melhor pele</p>

    <form>
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="voce@email.com">

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="••••••••">

      <button type="submit" class="btn-primary">Entrar na Glowy</button>
    </form>

    <div class="divider"><span>ou</span></div>
    <button class="btn-google">Continuar com Google</button>

    <p class="footer-text">Não tem conta? <a href="#">Criar conta</a></p>
  </div>
</body>
                                            </html>
