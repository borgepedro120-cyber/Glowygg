<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar na Glowy — sua rotina de pele</title>
<style>
  :root {
    --teal-deep: #0e4f57;
    --teal-mid: #14707a;
    --cream: #fbf7f0;
    --gold: #d4a24c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, var(--teal-deep) 0%, var(--teal-mid) 100%);
    background-size: 200% 200%;
    animation: breathe 8s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  @keyframes breathe {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .card {
    background: var(--cream);
    border-radius: 20px;
    padding: 40px 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    opacity: 0;
    transform: translateY(20px);
    animation: rise 0.7s ease-out forwards;
  }
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  .mascote {
    display: flex;
    justify-content: center;
    margin-bottom: 8px;
  }
  .logo {
    text-align: center;
    margin-bottom: 8px;
  }
  .logo span {
    font-size: 1.9rem;
    font-weight: 700;
    color: var(--teal-deep);
    letter-spacing: -0.5px;
  }
  .subtitle {
    text-align: center;
    color: #6b6b6b;
    font-size: 0.95rem;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--teal-deep);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e0dcd3;
    border-radius: 10px;
    font-size: 0.95rem;
    background: #fff;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus {
    border-color: var(--teal-mid);
  }
  .btn-primary {
    width: 100%;
    padding: 13px;
    margin-top: 24px;
    background: var(--teal-deep);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }
  .btn-primary:hover {
    background: var(--teal-mid);
    transform: scale(1.02);
  }
  .divider {
    display: flex;
    align-items: center;
    margin: 20px 0;
    color: #a8a29a;
    font-size: 0.8rem;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #e0dcd3;
  }
  .divider span { padding: 0 12px; }
  .btn-google {
    width: 100%;
    padding: 12px;
    background: #fff;
    border: 1.5px solid #e0dcd3;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 500;
    color: #333;
    cursor: pointer;
  }
  .footer-text {
    text-align: center;
    margin-top: 24px;
    font-size: 0.88rem;
    color: #6b6b6b;
  }
  .footer-text a {
    color: var(--gold);
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mascote">
      <svg id="mascote-svg" viewBox="0 0 120 120" width="90" height="90">
        <circle cx="60" cy="60" r="50" fill="#d4a24c"/>
        <circle id="olho-esq" cx="42" cy="55" r="9" fill="#fff"/>
        <circle id="pupila-esq" cx="42" cy="55" r="4" fill="#0e4f57"/>
        <circle id="olho-dir" cx="78" cy="55" r="9" fill="#fff"/>
        <circle id="pupila-dir" cx="78" cy="55" r="4" fill="#0e4f57"/>
        <path d="M45 80 Q60 90 75 80" stroke="#0e4f57" stroke-width="3" fill="none" stroke-linecap="round"/>
        <g id="mao-esq" style="opacity:0; transition: opacity 0.25s;">
          <ellipse cx="42" cy="55" rx="13" ry="13" fill="#d4a24c" stroke="#b9863a" stroke-width="2"/>
        </g>
        <g id="mao-dir" style="opacity:0; transition: opacity 0.25s;">
          <ellipse cx="78" cy="55" rx="13" ry="13" fill="#d4a24c" stroke="#b9863a" stroke-width="2"/>
        </g>
      </svg>
    </div>
    <div class="logo"><span>Glowy</span></div>
    <p class="subtitle">Bem-vindo à sua melhor pele</p>

    <form>
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="voce@email.com">

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="••••••••">

      <button type="submit" class="btn-primary">Entrar na Glowy</button>
    </form>

    <div class="divider"><span>ou</span></div>
    <button class="btn-google">Continuar com Google</button>

    <p class="footer-text">Não tem conta? <a href="#">Criar conta</a></p>
  </div>

<script>
  const pupilaEsq = document.getElementById('pupila-esq');
  const pupilaDir = document.getElementById('pupila-dir');
  const maoEsq = document.getElementById('mao-esq');
  const maoDir = document.getElementById('mao-dir');
  const svg = document.getElementById('mascote-svg');
  const senhaInput = document.getElementById('senha');

  document.addEventListener('mousemove', (e) => {
    const rect = svg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
    const dist = 3;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    pupilaEsq.setAttribute('cx', 42 + dx);
    pupilaEsq.setAttribute('cy', 55 + dy);
    pupilaDir.setAttribute('cx', 78 + dx);
    pupilaDir.setAttribute('cy', 55 + dy);
  });

  senhaInput.addEventListener('focus', () => {
    maoEsq.style.opacity = '1';
    maoDir.style.opacity = '1';
  });
  senhaInput.addEventListener('blur', () => {
    maoEsq.style.opacity = '0';
    maoDir.style.opacity = '0';
  });
</script>
</body>
</html>
