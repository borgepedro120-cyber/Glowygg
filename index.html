<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar na Glowy — sua rotina de pele</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --teal-deep: #0e4f57;
    --teal-mid: #17828d;
    --cream: #fdfaf4;
    --gold: #d4a24c;
    --blush: #f2c9b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at 20% 20%, #1a6b74, var(--teal-deep) 60%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
  }
  .drop {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), rgba(255,255,255,0.05));
    filter: blur(1px);
    animation: float 10s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-30px) translateX(10px); }
  }
  .card {
    position: relative;
    background: rgba(253, 250, 244, 0.92);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 44px 34px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.3);
    opacity: 0;
    transform: translateY(24px);
    animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    z-index: 1;
  }
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  .mascote {
    display: flex;
    justify-content: center;
    margin-bottom: 4px;
  }
  .logo {
    text-align: center;
    margin-bottom: 4px;
  }
  .logo span {
    font-family: 'Fraunces', serif;
    font-size: 2.1rem;
    font-weight: 600;
    color: var(--teal-deep);
    letter-spacing: -0.5px;
  }
  .subtitle {
    text-align: center;
    color: #8a8478;
    font-size: 0.92rem;
    margin-bottom: 30px;
    font-style: italic;
  }
  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--teal-mid);
    margin-bottom: 6px;
    margin-top: 18px;
  }
  input {
    width: 100%;
    padding: 13px 14px;
    border: none;
    border-bottom: 2px solid #e5ddc9;
    border-radius: 4px 4px 0 0;
    font-size: 0.95rem;
    background: rgba(255,255,255,0.6);
    outline: none;
    transition: border-color 0.25s, background 0.25s;
  }
  input:focus {
    border-color: var(--gold);
    background: rgba(255,255,255,0.9);
  }
  .btn-primary {
    width: 100%;
    padding: 14px;
    margin-top: 28px;
    background: linear-gradient(135deg, var(--teal-mid), var(--teal-deep));
    color: #fff;
    border: none;
    border-radius: 30px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 20px rgba(14,79,87,0.35);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(14,79,87,0.45);
  }
  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .divider {
    display: flex;
    align-items: center;
    margin: 24px 0;
    color: #b3ab9a;
    font-size: 0.78rem;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #e5ddc9;
  }
  .divider span { padding: 0 12px; }
  .btn-google {
    width: 100%;
    padding: 12px;
    background: #fff;
    border: 1.5px solid #e5ddc9;
    border-radius: 30px;
    font-size: 0.92rem;
    font-weight: 500;
    color: #4a453c;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .btn-google:hover { border-color: var(--gold); }
  .footer-text {
    text-align: center;
    margin-top: 26px;
    font-size: 0.86rem;
    color: #8a8478;
  }
  .footer-text a {
    color: var(--gold);
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .msg {
    text-align: center;
    font-size: 0.85rem;
    margin-top: 14px;
    min-height: 18px;
  }
  .msg.error { color: #c0392b; }
  .msg.success { color: #1e824c; }
</style>
</head>
<body>
  <div class="drop" style="width:60px;height:60px;top:10%;left:15%;animation-delay:0s;"></div>
  <div class="drop" style="width:30px;height:30px;top:70%;left:80%;animation-delay:2s;"></div>
  <div class="drop" style="width:45px;height:45px;top:80%;left:20%;animation-delay:4s;"></div>
  <div class="drop" style="width:20px;height:20px;top:20%;left:75%;animation-delay:1s;"></div>

  <div class="card">
    <div class="mascote">
      <svg id="mascote-svg" viewBox="0 0 120 120" width="88" height="88">
        <circle cx="60" cy="60" r="50" fill="#d4a24c"/>
        <circle id="olho-esq" cx="42" cy="55" r="9" fill="#fff"/>
        <circle id="pupila-esq" cx="42" cy="55" r="4" fill="#0e4f57"/>
        <circle id="olho-dir" cx="78" cy="55" r="9" fill="#fff"/>
        <circle id="pupila-dir" cx="78" cy="55" r="4" fill="#0e4f57"/>
        <path d="M45 80 Q60 90 75 80" stroke="#0e4f57" stroke-width="3" fill="none" stroke-linecap="round"/>
        <g id="mao-esq" style="opacity:0; transition: opacity 0.25s;">
          <ellipse cx="42" cy="55" rx="13" ry="13" fill="#d4a24c" stroke="#b9863a" stroke-width="2"/>
        </g>
        <g id="mao-dir" style="opacity:0; transition: opacity 0.25s;">
          <ellipse cx="78" cy="55" rx="13" ry="13" fill="#d4a24c" stroke="#b9863a" stroke-width="2"/>
        </g>
      </svg>
    </div>
    <div class="logo"><span>Glowy</span></div>
    <p class="subtitle" id="subtitle">Bem-vindo à sua melhor pele</p>

    <form id="auth-form">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="voce@email.com" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="••••••••" required minlength="6">

      <button type="submit" class="btn-primary" id="btn-submit">Entrar na Glowy</button>
    </form>

    <p class="msg" id="msg"></p>

    <div class="divider"><span>ou</span></div>
    <button class="btn-google" id="btn-google">Continuar com Google</button>

    <p class="footer-text" id="footer-text">Não tem conta? <a id="toggle-mode">Criar conta</a></p>
  </div>

<script>
  const SUPABASE_URL = 'https://uupqiqxsnwwzspqhyalq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1cHFpcXhzbnd3enNwcWh5YWxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MTg5MzcsImV4cCI6MjEwMzE5NDkzN30.RZX7e6QaR9lCEwaxWXJZzxJyUkbjC6rPubpQyI7ln5o';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let modoCadastro = false;

  const form = document.getElementById('auth-form');
  const emailInput = document.getElementById('email');
  const senhaInput = document.getElementById('senha');
  const btnSubmit = document.getElementById('btn-submit');
  const msg = document.getElementById('msg');
  const footerText = document.getElementById('footer-text');
  const subtitle = document.getElementById('subtitle');

  function mostrarMensagem(texto, tipo) {
    msg.textContent = texto;
    msg.className = 'msg ' + tipo;
  }

  footerText.addEventListener('click', (e) => {
    if (e.target.tagName !== 'A') return;
    e.preventDefault();
    modoCadastro = !modoCadastro;
    msg.textContent = '';
    if (modoCadastro) {
      btnSubmit.textContent = 'Criar minha conta';
      subtitle.textContent = 'Vamos começar sua rotina';
      footerText.innerHTML = 'Já tem conta? <a id="toggle-mode">Entrar</a>';
    } else {
      btnSubmit.textContent = 'Entrar na Glowy';
      subtitle.textContent = 'Bem-vindo à sua melhor pele';
      footerText.innerHTML = 'Não tem conta? <a id="toggle-mode">Criar conta</a>';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();
    const senha = senhaInput.value;

    if (!email || !senha) {
      mostrarMensagem('Preencha e-mail e senha.', 'error');
      return;
    }
    if (senha.length < 6) {
      mostrarMensagem('A senha precisa ter pelo menos 6 caracteres.', 'error');
      return;
    }

    btnSubmit.disabled = true;
    btnSubmit.textContent = modoCadastro ? 'Criando conta...' : 'Entrando...';
    msg.textContent = '';

    try {
      if (modoCadastro) {
        const { data, error } = await supabaseClient.auth.signUp({ email, password: senha });
        if (error) throw error;
        mostrarMensagem('Conta criada! Você já pode entrar.', 'success');
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
        if (error) throw error;
        mostrarMensagem('Login feito com sucesso!', 'success');
      }
    } catch (err) {
      mostrarMensagem(err.message || 'Algo deu errado. Tente de novo.', 'error');
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.textContent = modoCadastro ? 'Criar minha conta' : 'Entrar na Glowy';
    }
  });

  const pupilaEsq = document.getElementById('pupila-esq');
  const pupilaDir = document.getElementById('pupila-dir');
  const maoEsq = document.getElementById('mao-esq');
  const maoDir = document.getElementById('mao-dir');
  const svg = document.getElementById('mascote-svg');

  document.addEventListener('mousemove', (e) => {
    const rect = svg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
    const dist = 3;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    pupilaEsq.setAttribute('cx', 42 + dx);
    pupilaEsq.setAttribute('cy', 55 + dy);
    pupilaDir.setAttribute('cx', 78 + dx);
    pupilaDir.setAttribute('cy', 55 + dy);
  });

  senhaInput.addEventListener('focus', () => {
    maoEsq.style.opacity = '1';
    maoDir.style.opacity = '1';
  });
  senhaInput.addEventListener('blur', () => {
    maoEsq.style.opacity = '0';
    maoDir.style.opacity = '0';
  });
</script>
</body>
</html>
